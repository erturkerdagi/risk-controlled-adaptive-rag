[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rarag"
version = "1.0.0"
description = "Risk-controlled three-way policy (answer, retrieve, abstain) for adaptive RAG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ertürk Erdağı" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "pyarrow>=14", "tqdm"]
test = ["pytest"]

[tool.setuptools]
packages = ["rarag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
